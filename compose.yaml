name: profile

services:
  web:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      - checker
    ports:
      - "${PORT:-3082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  checker:
    image: node:24-alpine
    user: node
    restart: unless-stopped
    working_dir: /app
    command: node checker.mjs
    volumes:
      - ./checker.mjs:/app/checker.mjs:ro
      - ./data.json:/app/data.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
