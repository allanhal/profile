map $uri $browser_cache {
  default "public, max-age=0, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/api/ "no-store";
  /version.txt "no-store";
}

map $uri $edge_cache {
  default "public, max-age=31536000, stale-if-error=86400";
  ~^/api/ "no-store";
  /version.txt "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  open_file_cache max=1000 inactive=365d;
  open_file_cache_valid 365d;
  open_file_cache_errors off;

  add_header Cache-Control $browser_cache;
  add_header Cloudflare-CDN-Cache-Control $edge_cache;
  add_header X-Content-Type-Options "nosniff" always;

  error_page 404 = @not_found;

  location @not_found {
    add_header Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
  }

  location = /api/live-status {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $checker http://checker:3000;
    proxy_pass $checker;
    proxy_read_timeout 45s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
